[package]
name = "ddd-toolkit-core"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Core traits and helpers for Domain-Driven Design: entities, value objects, aggregates, persistence, CQRS, and event-driven workflows."
repository = "https://github.com/ryoshrimp/ddd-toolkit"
documentation = "https://docs.rs/ddd-toolkit-core"
readme = "README.md"
keywords = ["ddd", "domain-driven-design", "entity", "value-object", "aggregate"]
categories = ["rust-patterns", "data-structures"]
exclude = [".github"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", optional = true }
serde_with = { version = "3.24.0", default-features = false, optional = true }
subtle = { version = "2.6.1", default-features = false, optional = true }
zeroize = { version = "1.9.1", optional = true }

[features]
default = ["cqrs", "event_sourcing", "delivery", "process", "secret"]
cqrs = []
event_sourcing = []
delivery = ["event_sourcing"]
process = []
secret = ["dep:subtle", "dep:zeroize"]
serde = ["dep:serde"]
serde_with = ["serde", "secret", "dep:serde_with"]

[dev-dependencies]
trybuild = "1.0.121"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
