[package]
name = "ddd-toolkit"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Domain-Driven Design building blocks for Rust: a facade over ddd-toolkit-core and its derive macros."
repository = "https://github.com/ryoshrimp/ddd-toolkit"
documentation = "https://docs.rs/ddd-toolkit"
readme = "README.md"
keywords = ["ddd", "domain-driven-design", "entity", "value-object", "aggregate"]
categories = ["rust-patterns", "data-structures"]
exclude = [".github", "scripts"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["crates/core", "crates/macro", "facade-tests"]
resolver = "3"

[workspace.dependencies]
ddd-toolkit-core = { version = "0.4.2", path = "crates/core" }
ddd-toolkit-macro = { version = "0.4.2", path = "crates/macro" }


[dependencies]
ddd-toolkit-core = { workspace = true }
ddd-toolkit-macro = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }


[features]
default = ["derive"]
derive = ["dep:ddd-toolkit-macro"]
serde = ["ddd-toolkit-core/serde", "dep:serde"]
