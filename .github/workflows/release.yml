name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish unpublished manifest versions to crates.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: ./scripts/check-feature-matrix.sh
      - name: Verify UI diagnostics (required before publishing)
        run: ./scripts/check-ui-tests.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - if: ${{ !inputs.publish }}
        run: python3 scripts/release.py

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Do not restore build caches in the privileged publishing job.
      - name: Authenticate to crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - run: python3 scripts/release.py --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
