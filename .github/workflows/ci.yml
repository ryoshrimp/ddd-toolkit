name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p ddd-toolkit --examples --all-features --locked
      - name: Run facade examples
        run: |
          cargo run -p ddd-toolkit --example getting_started --all-features --locked
          cargo run -p ddd-toolkit --example dispatch_retry --all-features --locked
          cargo run -p ddd-toolkit --example cqrs --all-features --locked
          cargo run -p ddd-toolkit --example event_sourcing --all-features --locked
          cargo run -p ddd-toolkit --example reliable_delivery --all-features --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  ui-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-ui-tests.sh

  # Preserve the existing required status check, even for failed/skipped jobs.
  test:
    if: ${{ always() }}
    needs: [functional-tests, ui-diagnostics]
    runs-on: ubuntu-latest
    steps:
      - name: Require functional tests and UI diagnostics
        env:
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          UI_RESULT: ${{ needs.ui-diagnostics.result }}
        run: test "$FUNCTIONAL_RESULT" = success && test "$UI_RESULT" = success

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-feature-matrix.sh

  miri-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo +nightly miri setup
      # Only this integration target: no workspace, doctests, or trybuild suites.
      - run: cargo +nightly miri test -p ddd-toolkit-core --no-default-features --test secret --locked

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
