[package]
name = "ddd-toolkit-facade-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ddd-toolkit = { path = "..", features = ["derive", "serde"] }
# Macro 0.4 resolves this package directly, even when derives are re-exported.
ddd-toolkit-core = { workspace = true }

[dev-dependencies]
serde_json = "1"
zeroize = "1"
