[package]
name = "ddd-toolkit-facade-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ddd-toolkit = { path = "..", features = ["derive", "serde_with"] }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros", "std"] }
zeroize = "1"
